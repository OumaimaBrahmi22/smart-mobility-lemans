
name: Build static reference

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - run: python scripts/build_static_reference.py
      - name: Analyze supply vs population
        run: python scripts/analyze_supply_population.py
      - name: Commit updated reference and analysis data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gtfs_static/ data/analysis/
          git commit -m "Update static reference and supply analysis [automated]" || echo "Nothing to commit"
          git push
